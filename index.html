<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAYPAYKOLEKSIVIDEO</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR BIRU MUDA */
    .navbar {
      background-color: #bae6fd;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .navbar-brand i {
      font-size: 26px;
      color: #0284c7;
    }

    .navbar-title {
      font-size: 20px;
      font-weight: 800;
      color: #0369a1;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    /* CONTAINER UTAMA */
    .container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 20px;
      flex-grow: 1;
    }

    /* 1. TAMPILAN AWAL (HANYA LIST/GRID VIDEO) */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .video-card {
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.15);
      border-color: #38bdf8;
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background-color: #e2e8f0;
      overflow: hidden;
    }

    .thumbnail-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .video-card:hover .play-overlay {
      opacity: 1;
    }

    .play-btn-icon {
      width: 48px;
      height: 48px;
      background-color: #0284c7;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .card-meta {
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 2. TAMPILAN PEMUTAR VIDEO (BARU MUNCUL PAS DIKLIK) */
    .watch-layout {
      display: none;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 992px) {
      .watch-layout {
        grid-template-columns: 1fr 380px;
      }
    }

    /* KIRI: VIDEO BESAR */
    .main-player-container {
      display: flex;
      flex-direction: column;
    }

    .back-btn {
      margin-bottom: 12px;
      background: none;
      border: none;
      color: #0284c7;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    .back-btn:hover {
      text-decoration: underline;
    }

    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* BLOKER UNTUK MENUTUPI IKON DRIVE DI POJOK KANAN ATAS */
    .drive-blocker {
      position: absolute;
      top: 0;
      right: 0;
      width: 70px;
      height: 70px;
      background: transparent;
      z-index: 10;
      cursor: default;
    }

    .video-details {
      margin-top: 16px;
    }

    .video-details h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    /* KANAN: LIST VIDEO YOUTUBE STYLE */
    .sidebar-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sidebar-title {
      font-size: 16px;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 6px;
    }

    .sidebar-card {
      display: flex;
      gap: 12px;
      background-color: #ffffff;
      border-radius: 8px;
      padding: 8px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .sidebar-card:hover {
      border-color: #38bdf8;
      background-color: #f0f9ff;
    }

    .sidebar-thumb {
      width: 120px;
      height: 68px;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
      background-color: #cbd5e1;
    }

    .sidebar-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sidebar-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .sidebar-info-title {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.3;
    }

    .sidebar-info-meta {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 13px;
      border-top: 1px solid #e2e8f0;
      margin-top: auto;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- NAVBAR BIRU MUDA -->
  <header class="navbar">
    <a onclick="showGridView()" class="navbar-brand">
      <i class="fa-solid fa-circle-play"></i>
      <span class="navbar-title">MAYPAYKOLEKSIVIDEO</span>
    </a>
  </header>

  <div class="container">

    <!-- 1. HANYA LIST VIDEO DI AWAL -->
    <div id="gridView" class="grid-view">
      <!-- Dimuat via JavaScript -->
    </div>

    <!-- 2. PEMUTAR VIDEO (BARU MUNCUL PAS DIKLIK) -->
    <div id="watchLayout" class="watch-layout">
      <!-- KIRI: PLAYER BESAR -->
      <div class="main-player-container">
        <button class="back-btn" onclick="showGridView()">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Galeri
        </button>
        <div class="video-wrapper">
          <!-- Pelindung Ikon Google Drive -->
          <div class="drive-blocker"></div>
          
          <iframe id="mainPlayer" src="" allow="autoplay" allowfullscreen></iframe>
        </div>
        <div class="video-details">
          <h1 id="activeTitle">Judul Video</h1>
        </div>
      </div>

      <!-- KANAN: LIST LAINNYA -->
      <div>
        <div class="sidebar-title">Koleksi Lainnya</div>
        <div class="sidebar-list" id="sidebarList">
          <!-- Dimuat via JavaScript -->
        </div>
      </div>
    </div>

  </div>

  <footer>
    &copy; 2026 MAYPAYKOLEKSIVIDEO — Google Drive Streaming
  </footer>

  <!-- 1. MEMANGGIL FILE EXTERNAL VIDEOS.JS -->
  <script src="videos.js"></script>

  <!-- 2. SCRIPT LOGIKA PROGRAM -->
  <script>
    const gridView = document.getElementById('gridView');
    const watchLayout = document.getElementById('watchLayout');
    const mainPlayer = document.getElementById('mainPlayer');
    const activeTitle = document.getElementById('activeTitle');
    const sidebarList = document.getElementById('sidebarList');

    // Mengambil File ID dari Link Google Drive jika user memasukkan full URL
    function getCleanId(idOrUrl) {
      if (!idOrUrl) return "";
      if (idOrUrl.length === 33 && !idOrUrl.includes('/')) return idOrUrl;
      const match = idOrUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : idOrUrl;
    }

    // Tampilan Awal: Hanya List/Grid
    function showGridView() {
      mainPlayer.src = "";
      watchLayout.style.display = 'none';
      gridView.style.display = 'grid';
    }

    // Tampilan Saat Video Diklik (Mode Nonton YouTube)
    function playVideo(rawId, title) {
      const cleanId = getCleanId(rawId);
      mainPlayer.src = `https://drive.google.com/file/d/${cleanId}/preview`;
      activeTitle.textContent = title;

      gridView.style.display = 'none';
      watchLayout.style.display = 'grid';

      renderSidebar(cleanId);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Render Galeri Awal
    function renderGrid() {
      gridView.innerHTML = '';
      if (typeof videoList === 'undefined' || videoList.length === 0) {
        gridView.innerHTML = '<p>Belum ada video di videos.js</p>';
        return;
      }

      videoList.forEach(video => {
        const cleanId = getCleanId(video.id);
        const thumbUrl = `https://drive.google.com/thumbnail?id=${cleanId}&sz=w800`;
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => playVideo(cleanId, video.title);

        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${thumbUrl}" class="thumbnail-img" alt="${video.title}" onerror="this.src='https://placehold.co/600x337/e2e8f0/0284c7?text=MAYPAY+VIDEO'">
            <div class="play-overlay">
              <div class="play-btn-icon"><i class="fa-solid fa-play"></i></div>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title">${video.title}</div>
            <div class="card-meta">
              <i class="fa-brands fa-google-drive"></i> Putar Video
            </div>
          </div>
        `;
        gridView.appendChild(card);
      });
    }

    // Render List Samping (Kanan)
    function renderSidebar(currentId) {
      sidebarList.innerHTML = '';
      videoList.forEach(video => {
        const cleanId = getCleanId(video.id);
        if (cleanId === currentId) return;

        const thumbUrl = `https://drive.google.com/thumbnail?id=${cleanId}&sz=w400`;
        const card = document.createElement('div');
        card.className = 'sidebar-card';
        card.onclick = () => playVideo(cleanId, video.title);

        card.innerHTML = `
          <div class="sidebar-thumb">
            <img src="${thumbUrl}" alt="${video.title}" onerror="this.src='https://placehold.co/400x225/e2e8f0/0284c7?text=VIDEO'">
          </div>
          <div class="sidebar-info">
            <div class="sidebar-info-title">${video.title}</div>
            <div class="sidebar-info-meta"><i class="fa-solid fa-play"></i> Tonton</div>
          </div>
        `;
        sidebarList.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', renderGrid);
  </script>
</body>
</html>
