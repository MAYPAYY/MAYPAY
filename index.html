<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar Video Google Drive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    input[type="text"] {
      width: 70%;
      padding: 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 8px;
    }
    button {
      padding: 12px 20px;
      font-size: 14px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    .video-wrapper {
      margin-top: 25px;
      position: relative;
      padding-bottom: 56.25%; /* Rasio 16:9 */
      height: 0;
      overflow: hidden;
      border-radius: 8px;
      background: #000;
      display: none;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Pemutar Video Google Drive</h2>
    <p>Tempelkan link berbagi dari Google Drive di bawah ini:</p>
    
    <div>
      <input type="text" id="driveUrl" placeholder="https://drive.google.com/file/d/.../view?usp=sharing">
      <button onclick="playVideo()">Putar Video</button>
    </div>

    <div class="video-wrapper" id="videoContainer">
      <iframe id="videoPlayer" src="" allow="autoplay" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    function playVideo() {
      const urlInput = document.getElementById('driveUrl').value.trim();
      const container = document.getElementById('videoContainer');
      const player = document.getElementById('videoPlayer');

      // Ekstrak FILE_ID dari tautan Google Drive
      const match = urlInput.match(/\/d\/([a-zA-Z0-9_-]+)/);

      if (match && match[1]) {
        const fileId = match[1];
        // Ubah URL menjadi format /preview agar bisa di-embed langsung
        player.src = `https://drive.google.com/file/d/${fileId}/preview`;
        container.style.display = 'block';
      } else {
        alert('Tautan Google Drive tidak valid! Pastikan format tautan benar.');
      }
    }
  </script>

</body>
</html>
