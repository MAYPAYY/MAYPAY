<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAYPAYKOLEKSIVIDEO</title>
  
  <!-- FAVICON EMOJI -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>▶️</text></svg>">

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* NAVBAR BIRU MUDA */
    .navbar {
      background-color: #bae6fd;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .navbar-brand i {
      font-size: 24px;
      color: #0284c7;
    }

    .navbar-title {
      font-size: 18px;
      font-weight: 800;
      color: #0369a1;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    /* CONTAINER UTAMA */
    .container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 16px 14px;
      flex-grow: 1;
    }

    /* TOMBOL FILTER KATEGORI */
    .filter-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      background-color: #ffffff;
      border: 1px solid #bae6fd;
      color: #0369a1;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.2);
    }

    /* GRID VIDEO */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .video-card {
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .video-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.15);
      border-color: #38bdf8;
    }

    .thumbnail-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      background-color: #e2e8f0;
      overflow: hidden;
    }

    .thumbnail-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .video-card:hover .play-overlay {
      opacity: 1;
    }

    .play-btn-icon {
      width: 44px;
      height: 44px;
      background-color: #0284c7;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .card-meta {
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===================================================
       MODAL PEMUTAR SEPERTI GOOGLE DRIVE ASLI
       =================================================== */
    .drive-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .drive-modal.active {
      display: flex;
    }

    /* HEADER MODAL */
    .modal-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .modal-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .close-btn {
      background: #ef4444;
    }

    .close-btn:hover {
      background: #dc2626;
    }

    /* BINGKAI IFRAME DRIVE MODAL */
    .modal-player-box {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .modal-player-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      padding: 16px;
      color: #94a3b8;
      font-size: 12px;
      border-top: 1px solid #e2e8f0;
      margin-top: auto;
      background-color: #ffffff;
    }

    /* RESPONSIVE HP */
    @media (max-width: 600px) {
      .navbar {
        padding: 12px 16px;
      }

      .container {
        padding: 12px 8px;
      }

      .grid-view {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }

      .drive-modal {
        padding: 8px;
      }

      .modal-title {
        font-size: 14px;
      }

      .modal-player-box {
        aspect-ratio: 16 / 9;
        max-height: 70vh;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR BIRU MUDA -->
  <header class="navbar">
    <a onclick="closeVideoModal()" class="navbar-brand">
      <i class="fa-solid fa-circle-play"></i>
      <span class="navbar-title">MAYPAYKOLEKSIVIDEO</span>
    </a>
  </header>

  <div class="container">

    <!-- TOMBOL FILTER KATEGORI -->
    <div class="filter-container" id="filterContainer">
      <button class="filter-btn active" onclick="setFilter('ALL', this)">Semua Video</button>
      <button class="filter-btn" onclick="setFilter('S', this)">Kategori S</button>
      <button class="filter-btn" onclick="setFilter('C', this)">Kategori C</button>
    </div>

    <!-- TAMPILAN GRID VIDEO -->
    <div id="gridView" class="grid-view"></div>

  </div>

  <!-- MODAL PEMUTAR VIDEO SEPERTI GOOGLE DRIVE ASLI -->
  <div id="driveModal" class="drive-modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Judul Video</div>
      <div class="modal-actions">
        <!-- TOMBOL FULLSCREEN SIKU -->
        <button class="modal-btn" onclick="toggleFullScreen()">
          <i class="fa-solid fa-expand"></i> Layar Penuh
        </button>
        <!-- TOMBOL TUTUP -->
        <button class="modal-btn close-btn" onclick="closeVideoModal()">
          <i class="fa-solid fa-xmark"></i> Tutup
        </button>
      </div>
    </div>

    <div class="modal-player-box" id="modalPlayerBox">
      <iframe
        id="modalPlayer"
        src=""
        title="MAYPAY Video Player"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen">
      </iframe>
    </div>
  </div>

  <footer>
    &copy; 2026 MAYPAYKOLEKSIVIDEO — Google Drive Streaming
  </footer>

  <!-- FILE VIDEOS.JS -->
  <script src="videos.js?v=27"></script>

  <!-- LOGIKA MODAL GOOGLE DRIVE + FULLSCREEN API -->
  <script>
    const gridView = document.getElementById('gridView');
    const driveModal = document.getElementById('driveModal');
    const modalPlayer = document.getElementById('modalPlayer');
    const modalPlayerBox = document.getElementById('modalPlayerBox');
    const modalTitle = document.getElementById('modalTitle');

    let currentFilter = 'ALL';

    function getCleanId(idOrUrl) {
      if (!idOrUrl) return "";
      if (idOrUrl.length === 33 && !idOrUrl.includes('/')) return idOrUrl;
      const match = idOrUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : idOrUrl;
    }

    function setFilter(prefix, btnElement) {
      currentFilter = prefix;
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      renderGrid();
    }

    function openVideoModal(rawId, title) {
      const cleanId = getCleanId(rawId);

      if (!cleanId) {
        alert('ID video Google Drive tidak ditemukan.');
        return;
      }

      modalTitle.textContent = title;
      // Gunakan preview Drive resmi
      modalPlayer.src = `https://drive.google.com/file/d/${cleanId}/preview`;
      driveModal.classList.add('active');
      document.body.style.overflow = 'hidden'; // Kunci scroll halaman
    }

    function closeVideoModal() {
      modalPlayer.src = "";
      driveModal.classList.remove('active');
      document.body.style.overflow = 'auto'; // Buka scroll halaman
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
    }

    // FUNGSI AKTIFKAN FULLSCREEN APAPUN PERANGKATNYA
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        if (modalPlayerBox.requestFullscreen) {
          modalPlayerBox.requestFullscreen();
        } else if (modalPlayerBox.webkitRequestFullscreen) { /* Safari / iOS */
          modalPlayerBox.webkitRequestFullscreen();
        } else if (modalPlayerBox.msRequestFullscreen) {
          modalPlayerBox.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function renderGrid() {
      gridView.innerHTML = '';
      if (typeof videoList === 'undefined' || videoList.length === 0) {
        gridView.innerHTML = '<p>Belum ada video di videos.js</p>';
        return;
      }

      const filteredList = videoList.filter(video => {
        if (currentFilter === 'ALL') return true;
        const firstLetter = video.title.trim().charAt(0).toUpperCase();
        return firstLetter === currentFilter;
      });

      if (filteredList.length === 0) {
        gridView.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">Tidak ada video dengan awalan ' + currentFilter + '</p>';
        return;
      }

      filteredList.forEach(video => {
        const cleanId = getCleanId(video.id);
        const thumbUrl = `https://drive.google.com/thumbnail?id=${cleanId}&sz=w800`;
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => openVideoModal(cleanId, video.title);

        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${thumbUrl}" class="thumbnail-img" alt="${video.title}" onerror="this.src='https://placehold.co/600x337/e2e8f0/0284c7?text=MAYPAY+VIDEO'">
            <div class="play-overlay">
              <div class="play-btn-icon"><i class="fa-solid fa-play"></i></div>
            </div>
          </div>
          <div class="card-body">
            <div class="card-title">${video.title}</div>
            <div class="card-meta">
              <i class="fa-brands fa-google-drive"></i> Putar Video
            </div>
          </div>
        `;
        gridView.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', renderGrid);
  </script>
</body>
</html>
